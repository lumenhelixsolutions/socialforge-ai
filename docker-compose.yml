services:
  backend:
    build: ./backend
    ports: ["8787:8787"]
    environment:
      - DATABASE_URL=sqlite:///./data/local_social_agent.db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PUBLISHING_ENABLED=false
    volumes:
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      - VITE_API_BASE=http://localhost:8787
    depends_on: [backend]
